<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreateQR — Generador de Códigos QR con Estilos</title>
  <meta name="description" content="Generador de códigos QR standalone para URLs con gama de estilos personalizables, exportación a PNG y SVG.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <h1>CreateQR</h1>
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Cambiar entre modo oscuro y claro" title="Cambiar entre modo oscuro y claro" aria-pressed="false">☀️</button>
    </header>

    <main class="workspace">
      <section class="panel controls-panel" aria-label="Configuración del código QR">
        <div class="field-group">
          <label class="field-label" for="url-input">URL</label>
          <input
            id="url-input"
            class="url-input"
            type="url"
            placeholder="https://tu-sitio.com"
            autocomplete="url"
            spellcheck="false"
          >
          <p id="url-hint" class="field-hint"></p>
        </div>

        <div class="field-group">
          <div class="section-head">
            <h2>Estilo</h2>
          </div>
          <div id="preset-grid" class="preset-grid" role="group" aria-label="Gama de estilos de QR"></div>
        </div>

        <div class="field-group">
          <div class="section-head">
            <h2>Ajustes</h2>
          </div>

          <div class="controls-grid">
            <label class="control-item">
              <span>Forma de módulos</span>
              <select id="module-shape">
                <option value="square">Cuadrado clásico</option>
                <option value="rounded">Redondeado</option>
                <option value="dots">Puntos (Círculos)</option>
                <option value="classy">Elegante (Orgánico)</option>
                <option value="diamond">Diamante (Rombo)</option>
              </select>
            </label>

            <label class="control-item">
              <span>Esquinas (Ojos)</span>
              <select id="eye-shape">
                <option value="square">Cuadradas</option>
                <option value="rounded">Redondeadas</option>
                <option value="circle">Circulares</option>
              </select>
            </label>

            <label class="control-item">
              <span>Corrección de error</span>
              <select id="ec-level">
                <option value="L">Baja (L · 7%)</option>
                <option value="M" selected>Media (M · 15%)</option>
                <option value="Q">Alta (Q · 25%)</option>
                <option value="H">Máxima (H · 30%)</option>
              </select>
            </label>

            <label class="control-item checkbox-item">
              <span>Degradado de color</span>
              <span class="toggle-row">
                <input id="use-gradient" type="checkbox">
                <span>Activar degradado</span>
              </span>
            </label>
          </div>

          <div class="colors-grid">
            <label class="color-item">
              <span>Color principal</span>
              <input id="color-fg1" type="color" value="#1e1b4b">
            </label>

            <label id="fg2-wrap" class="color-item">
              <span>Color secundario</span>
              <input id="color-fg2" type="color" value="#4f46e5">
            </label>

            <label id="bg-wrap" class="color-item">
              <span>Fondo</span>
              <input id="color-bg" type="color" value="#f8fafc">
            </label>
          </div>

          <label class="toggle-row transparent-toggle">
            <input id="transparent-bg" type="checkbox">
            <span>Fondo transparente</span>
          </label>
        </div>
      </section>

      <aside class="panel preview-panel" aria-label="Vista previa y descarga">
        <div class="preview-frame">
          <div id="qr-preview" class="qr-preview"></div>
        </div>

        <p id="qr-meta" class="qr-meta"></p>

        <div class="actions-stack">
          <button id="btn-download-png" type="button" class="btn btn-primary">
            Descargar PNG (1024px)
          </button>
          <div class="actions-row">
            <button id="btn-download-svg" type="button" class="btn btn-secondary">
              Descargar SVG
            </button>
            <button id="btn-copy-png" type="button" class="btn btn-secondary">
              Copiar imagen
            </button>
          </div>
        </div>

        <p id="qr-status" class="status-msg" role="status" aria-live="polite"></p>
      </aside>
    </main>
  </div>

  <script src="./vendor/qrcode.js"></script>
  <script src="./app.js"></script>
</body>
</html>
